<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fff6f3">
<meta name="robots" content="noindex">
<meta name="description" content="A recipe shared from Big Saucy Recipes">
<title>Recipe · Big Saucy</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!--preview-->
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<!--
  A recipe shared from Big Saucy, opened from a link like https://<site>.pages.dev/r/AbC123xyz.
  On Cloudflare Pages, functions/r/[[path]].js answers those links: it reads the recipe's public copy from Firestore
  (shared/{id}), adds link-preview tags (name, summary, photo) at the preview marker in the head, and puts the recipe in
  window.__R so this page needn't fetch it again. Opened any other way, the page fetches the copy itself.
  "Copy recipe" copies the same plain text as the app's "Share as text", which Big Saucy's paste box reads back in.
-->
<style>
:root{--bg:#fff6f3;--card:#fff;--tx:#2b1618;--mu:#94706f;--bd:#f6dcd6;--pc:#ff4d5e;--pc2:#e8336b;--fld:#fbeae6;--fd:'Fredoka','Nunito',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.55 'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:var(--pc2);font-weight:700;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;overflow-wrap:anywhere}
.top{display:flex;align-items:center;justify-content:center;gap:7px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--card);border-bottom:1px solid var(--bd);font:600 20px/1.2 var(--fd);letter-spacing:-.2px;white-space:nowrap}
.jz{background:linear-gradient(90deg,#ff4d5e,#e8336b 55%,#1fa971);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
main{max-width:1000px;margin:0 auto;padding:24px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.head{display:flex;gap:28px;align-items:center;margin-bottom:28px}
.ph{flex:none;width:200px;height:200px;border-radius:50%;object-fit:cover;background:var(--fld);box-shadow:0 0 0 5px var(--card),0 0 0 6px var(--bd)}
h1{margin:0 0 6px;font:600 34px/1.15 var(--fd);color:var(--pc2);letter-spacing:-.3px}
h2{margin:0 0 10px;font:600 24px/1.2 var(--fd);color:var(--pc2)}
.cat{margin:0 0 8px;color:var(--mu);font-weight:700}
.facts{margin:0;padding:0;list-style:none}.facts b{font-weight:800}
button{font:800 15px 'Nunito',sans-serif;border:0;border-radius:12px;padding:11px 18px;color:#fff;background:linear-gradient(135deg,var(--pc),var(--pc2));cursor:pointer;margin-top:14px;box-shadow:0 4px 14px color-mix(in srgb,var(--pc) 30%,transparent)}
button:active{transform:translateY(1px)}
.body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:36px;align-items:start}
.col{display:flex;flex-direction:column;gap:28px}
section ul,section ol{margin:0;padding:0;list-style:none}
.ing li{padding:5px 0;border-bottom:1px solid var(--bd)}.ing li:last-child{border-bottom:0}
.ing .sub{border:0;padding:12px 0 2px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.dir li{margin:0 0 14px}
.dir .sub{margin:20px 0 8px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}.dir .sub:first-child{margin-top:0}
.notes p{margin:0;white-space:pre-wrap}
.nut li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid var(--bd)}.nut li:last-child{border-bottom:0}
.nut .hint{display:block;font-size:13px;color:var(--mu);border:0;padding-bottom:6px}
.msg{text-align:center;padding:60px 0;color:var(--mu)}.msg h1{margin-bottom:8px}
.sw{font:700 13px 'Nunito',sans-serif;color:var(--mu);letter-spacing:.02em;margin-right:2px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;transition:.2s;background:#2b1618;color:#fff;font-weight:700;padding:10px 18px;border-radius:99px;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:720px){
 .head{flex-direction:column;text-align:center;gap:18px;margin-bottom:24px}
 .ph{width:180px;height:180px}
 h1{font-size:28px}
 .body{display:flex;flex-direction:column;align-items:stretch;gap:26px}.col{display:contents}
 .ing{order:1}.dir{order:2}.notes{order:3}.nut{order:4}}
@media print{.top,button,#toast{display:none}body{background:#fff}main{padding-top:0}}
</style>
</head>
<body>
<header class="top"><span class="sw">Shared with</span><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#e8333f"/><circle cx="16" cy="16" r="12.2" fill="#ffe0dc"/><circle cx="16" cy="16" r="10.6" fill="#ff6b6b"/><path d="M16 6v20M6 16h20M8.6 8.6l14.8 14.8M23.4 8.6 8.6 23.4" stroke="#ffe0dc" stroke-width="1.7" stroke-linecap="round"/><circle cx="16" cy="16" r="2.2" fill="#ffe0dc"/></svg><span><span class="jz">Big Saucy</span> Recipes</span></header>
<main id="m"><p class="msg">Loading the recipe…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
const PROJECT='big-juicy-apps',KEY='AIzaSyB-qolJOepAn64lFq56Qv4ZwddZBOnbMCo';   // same public values as sync.js
const m=document.getElementById('m');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const isUrl=u=>/^https?:\/\//i.test(u||'');
// Escaped text with any web addresses turned into links
const linky=s=>esc(s).replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"]/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const fmtTime=x=>{x=Math.round(+x||0);if(!x)return '';const h=Math.floor(x/60),r=x%60;return h?h+' hr'+(r?' '+r+' min':''):r+' min'};
const fail=(t,p)=>{m.innerHTML=`<div class="msg"><h1>${t}</h1><p>${p}</p></div>`};

// Firestore's REST format -> plain values
const val=v=>'stringValue' in v?v.stringValue:'integerValue' in v?+v.integerValue:'doubleValue' in v?v.doubleValue:'booleanValue' in v?v.booleanValue
 :'arrayValue' in v?(v.arrayValue.values||[]).map(val):'mapValue' in v?obj(v.mapValue.fields||{}):null;
const obj=f=>Object.fromEntries(Object.entries(f).map(([k,v])=>[k,val(v)]));

// The same text as "Share as text" in the app, which Big Saucy's paste box reads back in
function recipeText(r){const L=[r.title||'Untitled'];if(r.serves)L.push('Serves '+r.serves);if(r.time)L.push(fmtTime(r.time));
 const sec=(h,a)=>{if(a.length)L.push('',h,...a)};
 sec('Ingredients',r.ing);
 {let c=0;sec('Directions',r.steps.map(x=>/:$/.test(x)?x:(++c)+'. '+x))}
 sec('Notes',String(r.notes||'').split('\n').map(x=>x.trim()).filter(Boolean));
 sec('Nutrition',r.nut);
 const ln=[isUrl(r.src)?'Source: '+r.src:r.src?'From: '+r.src:'',isUrl(r.vid)?'Video: '+r.vid:''].filter(Boolean);if(ln.length)L.push('',...ln);
 return L.join('\n')}

function show(r){const A=k=>Array.isArray(r[k])?r[k]:[];['meal','cuisine','protein','method','diet','ing','steps','nut'].forEach(k=>{if(k!='cuisine')r[k]=A(k)});
 const cat=[...r.meal,r.cuisine,...r.protein,...r.method,...r.diet].filter(Boolean).join(' · ');
 const facts=[r.serves?`<li><b>Serves:</b> ${esc(r.serves)}</li>`:'',r.time?`<li><b>Total time:</b> ${esc(fmtTime(r.time))}</li>`:'',
  isUrl(r.src)?`<li><b>Source:</b> <a href="${esc(r.src)}" target="_blank" rel="noopener">${esc(r.src)}</a></li>`:r.src?`<li><b>From:</b> ${esc(r.src)}</li>`:'',
  isUrl(r.vid)?`<li><b>Video:</b> <a href="${esc(r.vid)}" target="_blank" rel="noopener">${esc(r.vid)}</a></li>`:''].join('');
 const sp=t=>{const i=t.indexOf(':');return i<0?[t,'']:[t.slice(0,i).trim(),t.slice(i+1).trim()]};
 document.title=(r.title||'Recipe')+' · Big Saucy';
 m.innerHTML=`<div class="head">${/^data:image\//.test(r.img||'')?`<img class="ph" src="${esc(r.img)}" alt="${esc(r.title)}">`:''}<div>
  <h1>${esc(r.title||'Untitled')}</h1>${cat?`<p class="cat">${esc(cat)}</p>`:''}${facts?`<ul class="facts">${facts}</ul>`:''}
  <button id="cp" type="button">Copy as plain text</button></div></div>
 <div class="body"><div class="col">
  <section class="ing"><h2>Ingredients</h2><ul>${r.ing.map(l=>/:$/.test(l)?`<li class="sub">${esc(l.slice(0,-1))}</li>`:`<li>${linky(l)}</li>`).join('')||'<li>None listed.</li>'}</ul></section>
  ${r.nut.length?`<section class="nut"><h2>Nutrition</h2><ul><li class="hint">Per serving, as listed in the recipe</li>${r.nut.map(sp).map(([n,v])=>`<li><span>${esc(n)}</span><b>${esc(v)}</b></li>`).join('')}</ul></section>`:''}
 </div><div class="col">
  <section class="dir"><h2>Directions</h2><ol>${(()=>{let c=0;return r.steps.map(x=>/:$/.test(x)?`<li class="sub">${esc(x.slice(0,-1))}</li>`:`<li>${++c}. ${linky(x)}</li>`).join('')})()||'<li>None listed.</li>'}</ol></section>
  ${r.notes?`<section class="notes"><h2>Notes</h2><p>${linky(r.notes)}</p></section>`:''}
 </div></div>`;
 const text=recipeText(r);
 document.getElementById('cp').onclick=()=>copy(text)}

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function copy(t){const old=()=>{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(a);a.select();
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();toast(ok?'Copied as plain text':'Couldn’t copy. Select the text and copy it instead.')};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toast('Copied as plain text'),old);else old()}

const NF=()=>fail('Recipe not found','This link doesn’t lead to a recipe any more. It may have been deleted.');
if(window.__R===false)return NF();
if(window.__R)return show(window.__R);
const id=(/\/r\/([A-Za-z0-9]+)/.exec(location.pathname)||[])[1]||new URLSearchParams(location.search).get('r')||'';
if(!/^[A-Za-z0-9]{6,32}$/.test(id))return fail('Recipe not found','This link isn’t complete. Ask for the link again.');
fetch(`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/shared/${id}?key=${KEY}`)
 .then(res=>{if(res.status==404)throw 404;if(!res.ok)throw res.status;return res.json()})
 .then(d=>{const r=obj(d.fields||{});if(r.app!='cooking')throw 404;show(r)})
 .catch(e=>e===404?NF():fail('Couldn’t load this recipe','Check your connection and reload the page.'));
})();
</script>
</body>
</html>
