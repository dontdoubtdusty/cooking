<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Big Saucy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fff6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1615" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Big Saucy"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Theme: tomato red + basil green ===== */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light;--bg:#fff6f3;--card:#fff;--fld:#fdebe7;--tx:#2b1618;--mu:#94706f;--ac:#17a06a;--bd:#f6dcd6;--neg:#e5243b;--wn:#e08600;--pc:#ff4d5e;--pc2:#e8336b;--sh:0 1px 2px rgba(120,30,40,.05),0 10px 24px -14px rgba(120,30,40,.22);--gl:10%;--tst:#2b1618;--fast:.16s;--fd:'Fredoka','Nunito',system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1a1615;--card:#262020;--fld:#342a29;--tx:#fdf0ee;--mu:#c3a6a2;--ac:#4fdba0;--bd:#3e3332;--neg:#ff6b76;--wn:#ffb547;--sh:0 10px 26px -14px rgba(0,0,0,.65);--gl:20%;--tst:#3b2e2e}
:root[data-theme="dark"] .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),var(--sh)}:root[data-theme="dark"] .stats div{background:color-mix(in srgb,var(--pc) 14%,var(--card))}

/* ===== Base ===== */
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 440px at 50% -140px,color-mix(in srgb,var(--pc) var(--gl),transparent),transparent 72%) no-repeat,var(--bg);color:var(--tx);font:500 15px/1.45 'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overflow-x:clip;-webkit-font-smoothing:antialiased}
body.hast{padding-bottom:calc(132px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font-family:inherit}input,select,button,b{font-variant-numeric:tabular-nums}
main{max-width:1100px;margin:0 auto;padding:12px}
.vclip{overflow:hidden;overflow:clip;width:100%}
.view{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start;touch-action:pan-y}
.view>.seg,.view>h2,.view>p,.view>.wide,.view>.warn,.view>.hello,.view>.bk,.view>.savebar{grid-column:1/-1}
h2,h3{margin:0 0 10px;font-family:var(--fd);font-weight:600}h2{font-size:20px;letter-spacing:-.2px}h3{font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary h3{margin:0}
.mu{color:var(--mu);font-size:13px}.b{font-weight:700}
.sec{display:block;font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mu);margin:2px 0 6px}
.pre{white-space:pre-wrap;margin:0}
a{color:var(--pc);font-weight:700}

/* ===== Cards & rows ===== */
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);padding:16px;min-width:0}
.view>.card{background-image:linear-gradient(90deg,var(--pc),var(--pc2));background-size:100% 5px;background-repeat:no-repeat;background-origin:border-box;padding-top:19px}.card h2{color:var(--pc)}
details.card>summary+*{margin-top:12px}
.row{display:flex;gap:8px;align-items:center;margin:2px 0;min-height:38px}.row>*{min-width:0}
.ed{gap:6px}
.bar{height:8px;background:var(--fld);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pc),var(--pc2));transition:width .35s cubic-bezier(.2,.8,.2,1)}
.bang{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-right:6px;border-radius:50%;background:var(--wn);color:#fff;font-weight:800;font-size:12px;line-height:1}
.warn{border-color:var(--wn);background:color-mix(in srgb,var(--wn) 10%,var(--card))}.warn h3{color:var(--wn);justify-content:flex-start}
.okc{border-color:color-mix(in srgb,var(--ac) 50%,transparent);background:color-mix(in srgb,var(--ac) 9%,var(--card))}

/* ===== Inputs & buttons ===== */
input[type=text],input[type=search],input[type=url],input[type=number],textarea,select{width:100%;padding:9px 10px;border:1px solid transparent;border-radius:12px;background:var(--fld);color:var(--tx);font:inherit;transition:border-color var(--fast),background var(--fast)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=search]::-webkit-search-decoration{display:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:color-mix(in srgb,var(--pc) 60%,transparent);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 18%,transparent)}
textarea{height:140px;font:12px ui-monospace,monospace}
textarea.rx{height:auto;min-height:130px;font:500 15px/1.55 'Nunito',sans-serif;resize:vertical}textarea.big{min-height:240px}textarea.sm{min-height:70px}
input.ttl{font:600 19px/1.3 var(--fd);padding:11px 12px}
.dt{position:relative;display:inline-flex;align-items:center;justify-content:center;width:66px;flex:none;padding:7px 4px;border-radius:10px;background:var(--fld);color:var(--tx);cursor:pointer;white-space:nowrap;font-size:14px}.dt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;margin:0;cursor:pointer}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:24px;height:24px;flex:none;margin:0;border:2px solid color-mix(in srgb,var(--mu) 45%,transparent);border-radius:8px;background:var(--card);display:inline-grid;place-content:center;cursor:pointer;transition:background var(--fast),border-color var(--fast)}
input[type=checkbox]::after{content:"";width:6px;height:11px;margin-top:-3px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .22s var(--bounce)}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--pc),var(--pc2));border-color:transparent}input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
input[type=checkbox].pop{animation:pop .3s var(--bounce)}@keyframes pop{40%{transform:scale(1.22)}}
button{background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff;border:0;border-radius:14px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--pc) 70%,transparent);transition:transform .25s var(--bounce),filter .1s,background var(--fast)}
button.g,button.x,nav button,.seg button,.gear,#toast button,.chip,.rc,.sl,.tmr,.tp button{box-shadow:none}
button:active{transform:scale(.93);filter:brightness(.95);transition-duration:.08s}
button:disabled{opacity:.4;pointer-events:none}
button.g{background:none;color:var(--mu);padding:8px 10px;font-weight:600}button.x{background:none;color:var(--neg);padding:8px 8px;font-weight:600}
button.bd{border:1px solid var(--bd);color:var(--tx)}
button.lnk{padding:0;color:var(--pc);font-weight:800;font-size:13px}
.seg{display:flex;gap:6px}.seg button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.seg.qm button{border-radius:999px;padding:9px 6px}.seg.qm button.on{background:linear-gradient(135deg,var(--pc),var(--pc2));border-color:transparent;color:#fff;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--pc) 70%,transparent)}

/* ===== Chips ===== */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--fld);color:var(--tx);border:1px solid transparent;border-radius:99px;padding:7px 13px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff}
.chip.add{background:none;border:1px dashed color-mix(in srgb,var(--mu) 55%,transparent);color:var(--mu)}
.chip.ed2{padding:0;gap:0}.chip.ed2 button{background:none;color:inherit;font:inherit;border-radius:99px;box-shadow:none}.chip.ed2 .cn{padding:7px 4px 7px 13px}.chip.ed2 .cx{padding:7px 11px 7px 6px;color:var(--mu)}.chip.ed2 i{font-style:normal;color:var(--mu);font-weight:600;margin-left:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--pc) 12%,transparent);color:var(--pc)}.pill.tg{background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac)}
.cnt{display:inline-grid;place-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff;font:800 12px 'Nunito',sans-serif;margin-left:6px;vertical-align:2px}
.fdet{margin-top:6px;border-top:1px solid var(--bd);padding-top:8px}.fdet>div{padding-top:4px}
.frow{padding:3px 0}.frow .chips{margin:0;gap:4px;align-items:center}
.frow .sec{display:inline;margin:0 4px 0 0;font-size:11px}.frow .chip{padding:4px 10px;font-size:12.5px}
.fsum{font-weight:600;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details[open] .fsum .ex,details:not([open]) .fsum .co{display:none}

/* ===== Header & bottom nav ===== */
.top{display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);color:var(--tx);border-bottom:1px solid var(--bd);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;margin-top:calc(-1 * env(safe-area-inset-top,0px));font:600 20px/1.2 var(--fd);letter-spacing:-.2px;text-align:center}
.top .tt{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 44px;white-space:nowrap}.top .logo{flex:none;animation:wob 4s ease-in-out infinite;transform-origin:50% 60%}@keyframes wob{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
.jz{background:linear-gradient(90deg,#ff4d5e,#e8336b 55%,#1fa971);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.gear{position:absolute;right:10px;bottom:7px;background:none;color:var(--mu);width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px}.gear.on{color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent)}
nav{position:fixed;z-index:6;left:0;right:0;bottom:0;display:flex;align-items:center;gap:2px;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--bd);padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-width:0;background:none;color:var(--mu);border-radius:16px;padding:6px 0 5px;font-size:11px;font-weight:700;letter-spacing:-.1px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .25s}nav button.on{color:var(--tc)}
nav button:not(.qab):active{transform:none;filter:none}
.nh{flex:1;display:flex;gap:2px;min-width:0;position:relative;z-index:1}.nh button{flex:1;min-width:0}.ni{width:23px;height:23px}
.hl{position:absolute;left:0;top:0;z-index:0;pointer-events:none;border-radius:16px;width:var(--hw,0);height:var(--hh,0);transform:translate3d(var(--hx,0),var(--hy,0),0);background:color-mix(in srgb,var(--hc,#ff4d5e) 14%,transparent);opacity:var(--ho,0);transition:transform .34s var(--bounce),width .34s var(--bounce),opacity .2s,background .25s}
nav.drag .hl{transition:none}
#peek{position:fixed;left:0;right:0;bottom:0;z-index:4;overflow:hidden;pointer-events:none;background:var(--bg);will-change:transform}
#peek>.view{max-width:1100px;margin:0 auto;padding:12px}
nav button.qab,nav button.qab.on{flex:none;width:62px;height:62px;margin:-24px 4px 0;border-radius:50%;background:linear-gradient(135deg,#e8336b,#ff5e62);color:#fff;padding:0;justify-content:center;gap:0;box-shadow:0 8px 20px -4px #ff4d5e80;border:4px solid var(--bg)}
nav button.qab b{font:600 30px/.9 var(--fd)}nav button.qab span{font-size:9px;font-weight:800}

/* ===== Toast ===== */
#toast{position:fixed;z-index:30;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);background:var(--tst);color:#fff;border-radius:18px;padding:10px 10px 10px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s}
body.hast #toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
#toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{background:none;color:#ffb020;padding:6px 10px;font-weight:800}

/* ===== Greeting, search, recipe rows ===== */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ctl{position:relative;aspect-ratio:1;border-radius:18px;padding:0;overflow:hidden;color:#fff;box-shadow:var(--sh);display:block;text-align:left;border:1px solid #0000000f}
.ctl b{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 9px;font:600 16px/1.15 var(--fd);text-shadow:0 1px 3px #0006;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl.flag{border-color:var(--bd);background-clip:padding-box!important}.ctl.flag b{background:var(--card);color:var(--tx);text-shadow:none;padding:8px 10px;font-size:15px;border-top:1px solid var(--bd)}
.ctl em{position:absolute;top:8px;right:8px;font-style:normal;font-weight:800;font-size:12px;min-width:24px;height:22px;padding:0 7px;display:grid;place-content:center;border-radius:99px;background:#00000059;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ctl.all{background:linear-gradient(135deg,var(--pc),var(--pc2))}
.ctl:active{transform:scale(.97)}
.hello{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 4px -2px}
.hello b{font:600 25px/1.2 var(--fd)}.hello span{flex:none;font-size:13px;font-weight:800;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent);padding:5px 12px;border-radius:99px}
.srch{display:flex;align-items:center;gap:8px;background:var(--fld);border-radius:14px;padding:0 12px;color:var(--mu)}.srch input{background:none!important;border:0!important;box-shadow:none!important;padding:11px 0;font-size:16px}
.rc{display:flex;align-items:center;gap:12px;width:100%;background:none;color:var(--tx);border-radius:14px;padding:8px 6px;text-align:left;font-weight:500}
.rc:active{transform:scale(.98);background:var(--fld)}
.rt{flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-content:center;color:#fff;font:600 17px var(--fd);letter-spacing:.4px;text-shadow:0 1px 2px #0003}
.rt.big{width:70px;height:70px;border-radius:21px;font-size:25px}
.rcn{flex:1;min-width:0;display:flex;flex-direction:column}.rcn b,.rcn .mu{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rcn b{font-weight:700;font-size:15px}
.chev{flex:none;color:var(--mu);opacity:.55}
.dbox{flex:none;width:48px;height:48px;border-radius:14px;background:var(--fld);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}.dbox b{font:600 18px var(--fd)}.dbox span{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--mu)}
.mh{margin:14px 6px 2px}.mh:first-child{margin-top:0}

/* ===== Recipe page ===== */
.bk{margin:0 0 -4px}.bk button{padding:6px 8px;font-weight:700}
.hr{display:flex;gap:14px;align-items:center}.hr h2{margin:0 0 2px;color:var(--tx);font-size:22px;line-height:1.2}
.acts{flex-wrap:wrap;margin-top:12px}.acts button{flex:1 1 auto}
.scl{display:flex;align-items:center;gap:6px;font-size:13px;font-family:'Nunito',sans-serif}
.sb{width:34px;height:34px;padding:0!important;border-radius:50%!important;border:1px solid var(--bd)!important;color:var(--tx)!important;font-size:19px!important;line-height:1}
.ingr{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--bd);cursor:pointer;line-height:1.4}
.ingr span{padding-top:2px}.ingr b{font-weight:800}
.ingr:has(input:checked) span{opacity:.45;text-decoration:line-through}
.ih{margin:14px 0 2px}
.srow>.ied{flex:none;width:36px;height:36px;padding:0;display:grid;place-content:center;color:var(--mu);border-radius:12px}
.ihr{border-top:0;margin-top:8px}.ihr .ih{flex:1;margin:0}
.ifoot{margin-top:6px;flex-wrap:wrap;gap:4px 12px;align-items:center}.ifoot .mu{margin-left:auto;font-size:12px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 40px;line-height:1.55}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff;font:600 14px/28px var(--fd);text-align:center}
.tmr{display:inline-flex;align-items:center;gap:4px;vertical-align:baseline;padding:1px 10px 1px 7px;margin:0 1px;border-radius:99px;font-size:.93em;font-weight:800;line-height:1.5;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}

/* ===== Cook mode ===== */
.ct{display:block;font:600 19px/1.25 var(--fd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.nv button{flex:1}
.sl{display:flex;gap:12px;width:100%;text-align:left;background:none;color:var(--tx);font-weight:500;padding:9px 6px;border-radius:12px;align-items:flex-start;line-height:1.45}
.sl.dn{opacity:.5}.sl:active{transform:scale(.98)}
.slnum{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-content:center;background:var(--fld);font:600 13px var(--fd)}
#tdock{position:fixed;z-index:7;left:0;right:0;bottom:calc(82px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 10px;pointer-events:none}
.tp{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--tst);color:#fff;border-radius:99px;padding:4px 4px 4px 14px;font-size:15px;font-weight:800;box-shadow:0 8px 20px -6px rgba(0,0,0,.45);max-width:100%}
.tp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;opacity:.85;font-size:12px;max-width:150px}
.tp button{background:#ffffff26;color:#fff;width:32px;height:32px;padding:0;border-radius:50%;flex:none;display:grid;place-content:center;font-size:11px;font-weight:800}
.tp.done{background:linear-gradient(135deg,#ff4d5e,#e8336b);animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.05)}}

/* ===== Add / edit ===== */
.lrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.lbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-weight:800;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbtn:active{transform:scale(.95)}.lbtn .ic{color:var(--pc)}
.sl.cur{background:color-mix(in srgb,var(--pc) 10%,transparent);padding:14px 10px;margin:4px 0}.sl.cur .slnum{background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff;width:30px;height:30px}.sl.cur .st{font:500 20px/1.55 var(--fd);margin:0 0 12px}
.g2f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.g2f label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--mu)}.g2f input{font:600 15px 'Nunito',sans-serif;color:var(--tx)}
.nrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--bd)}.nrow:first-of-type{border-top:0}.nrow b{font-weight:800;text-align:right}
.hint{font-size:12px;color:var(--mu);margin:6px 2px 0}

// ---- Minimal DOM diff: update only what changed, so typing focus, open sections and scroll stay put ----
function morphNode(a,b){

 if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
 for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);

 const tag=a.nodeName,act=a===document.activeElement;
 if(tag=='TEXTAREA'){if(!act&&a.value!==b.value)a.value=b.value;return}
 morphKids(a,b);
 if(tag=='INPUT'){if(a.type=='checkbox')a.checked=b.hasAttribute('checked');else if(a.type!='file'&&!act){const v=b.getAttribute('value')??'';if(a.value!==v)a.value=v}}
 else if(tag=='SELECT'){const i=Math.max(0,[...b.options].findIndex(o=>o.hasAttribute('selected')));if(a.selectedIndex!==i)a.selectedIndex=i}
 else if(tag=='DETAILS')a.open=b.hasAttribute('open')}
function morphKids(a,b){const A=[...a.childNodes],B=[...b.childNodes];B.forEach((n,i)=>i<A.length?morphNode(A[i],n):a.appendChild(n));for(let i=B.length;i<A.length;i++)A[i].remove()}
