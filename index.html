<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calories">
<meta name="description" content="A simple, private calorie tracker. Your log stays in your browser.">
<meta name="theme-color" content="#ffd84a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Big Juicy Calorie Tracker</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one phone column (two meal columns on wide screens), sticky header, fixed bottom nav with a center Add button, Add opens a bottom sheet.
   Color: citrus &#x2014; lemon, tangerine, lime, grapefruit &#x2014; one per meal. */
:root{--bg:#fffbea;--card:#ffffff;--fld:#fff3cc;--tx:#2b2410;--mu:#7a7052;--bd:#f0e2b2;
 --lemon:#f2b705;--lime:#5aa82a;--tang:#ff7a1a;--ex:#1b9fc2;--grape:#ec3f57;--ok:#3f8f1c;--over:#d92f48;
 --ink:#3a2300;--hero:linear-gradient(135deg,#ffd84a 0%,#ffae2b 55%,#ff8a1f 100%);
 --sh:0 1px 2px rgba(90,60,0,.06),0 10px 24px -14px rgba(130,80,0,.30);
 --fd:'Fredoka','Nunito',system-ui,sans-serif;--fb:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 --bounce:cubic-bezier(.34,1.56,.64,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ex:#4cc7e6;--bg:#15130a;--card:#211e11;--fld:#2d2916;--tx:#fbf4dc;--mu:#b5a983;--bd:#3a341d;--lemon:#ffd23f;--lime:#8ad457;--tang:#ff9b4a;--grape:#ff6b7c;--ok:#8ad457;--over:#ff6b7c;--sh:0 10px 24px -16px rgba(0,0,0,.75);color-scheme:dark}}
:root[data-theme="dark"]{--ex:#4cc7e6;--bg:#15130a;--card:#211e11;--fld:#2d2916;--tx:#fbf4dc;--mu:#b5a983;--bd:#3a341d;--lemon:#ffd23f;--lime:#8ad457;--tang:#ff9b4a;--grape:#ff6b7c;--ok:#8ad457;--over:#ff6b7c;--sh:0 10px 24px -16px rgba(0,0,0,.75);color-scheme:dark}

*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:500 15px/1.45 var(--fb);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-variant-numeric:tabular-nums}
b,.mt,.fc,.cv{font-variant-numeric:tabular-nums}
h2,h3{font-family:var(--fd);font-weight:600;margin:0;text-wrap:balance}
.mu{color:var(--mu);font-size:13px}
.sec{display:block;font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mu);margin:4px 0 6px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--tang) 70%,transparent);outline-offset:2px}

main,#peek>.pv{max-width:760px;margin:0 auto;padding-block:10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
.vclip{overflow:hidden;width:100%}
.ph{font-size:22px;margin:6px 2px 0}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--bd);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font:600 clamp(15px,4.6vw,20px)/1.2 var(--fd)}
.tt{display:flex;align-items:center;gap:7px;padding:0 40px;min-width:0;text-align:center}
.tt>span{text-wrap:balance}
.logo{flex:none;animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.jz{background:linear-gradient(90deg,#f2b705,#ff8a1f 55%,#ec3f57);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.gear{position:absolute;right:max(8px,env(safe-area-inset-right,0px));width:40px;height:40px;border:0;border-radius:12px;background:none;color:var(--mu);display:grid;place-content:center;cursor:pointer}
.gear.on{color:var(--tang);background:color-mix(in srgb,var(--tang) 14%,transparent)}

/* Cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:12px 12px 10px}
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;align-items:start}

/* Buttons & fields */
button{cursor:pointer;border:0;font:inherit}
.btn,.hbtn{background:var(--hero);color:var(--ink);border-radius:14px;padding:11px 16px;font-weight:800;box-shadow:0 6px 14px -7px rgba(255,120,20,.7);transition:transform .25s var(--bounce)}
.btn:active,.hbtn:active,.addm:active,.fb:active{transform:scale(.95)}
.btn.sec2{background:var(--fld);color:var(--tx);box-shadow:none}
.btn.wide{width:100%}
.lnk{background:none;color:var(--mu);padding:8px;font-weight:600}
.danger{background:none;color:var(--over);font-weight:700;padding:10px 4px}
input[type=text],input[type=number],select,textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid transparent;border-radius:12px;background:var(--fld);color:var(--tx);font:inherit;transition:border-color .15s,background .15s}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:color-mix(in srgb,var(--tang) 60%,transparent);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--tang) 18%,transparent)}
input.a{width:86px;flex:none;text-align:right}
textarea{height:120px;font:12px ui-monospace,monospace;margin:8px 0}
/* Food and exercise names wrap onto more lines instead of getting cut off */
textarea.nm{flex:1 1 auto;height:auto;min-height:0;margin:0;resize:none;overflow:hidden;font:inherit;line-height:1.3;padding:6px 4px;overflow-wrap:break-word;width:100%}
.ed input.a{width:54px}.ed textarea.nm{background:transparent}.ed textarea.nm:focus{background:var(--card)}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
/* Read mode rows: look like text until tapped */
.ed input[type=text],.ed input[type=number]{background:transparent;padding:6px 4px}
.ed input:focus{background:var(--card)}
@media(hover:hover){.ed input:hover,.ed textarea.nm:hover{background:var(--fld)}}
.x{flex:none;background:none;color:var(--mu);padding:8px 4px;border-radius:10px;display:grid;place-content:center}
.x:hover{color:var(--over)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;background:var(--fld);color:var(--tx);border-radius:999px;padding:9px 8px;font-weight:700;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--hero);color:var(--ink)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--fld);color:var(--mu);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--lime) 18%,transparent);color:var(--ok)}
.chip.over{background:color-mix(in srgb,var(--grape) 16%,transparent);color:var(--over)}

/* Today hero */
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--ink);border-radius:24px;padding:10px 14px 12px;box-shadow:0 14px 28px -14px rgba(255,120,20,.65)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero:before{left:-60px;bottom:-90px;width:200px;height:200px;background:#ffffff2e}
.hero:after{right:-50px;top:-70px;width:160px;height:160px;background:#ffffff22}
.hero>*{position:relative;z-index:1}
.dnav{display:flex;align-items:center;gap:8px}
.dnav>button{flex:none;width:40px;height:40px;border-radius:50%;background:#ffffff8c;color:var(--ink);display:grid;place-content:center;padding:0}
.dnav>button:disabled{opacity:.35;cursor:default}
.dnav>.dl{flex:1;min-width:0;width:auto;height:auto;border-radius:14px;text-align:center;background:none;color:var(--ink);line-height:1.2;padding:2px 4px;display:block}
.dl b,.dl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dl b{font:600 21px/1.2 var(--fd)}.dl span{font-size:13px;font-weight:700;opacity:.75}
.hb{display:flex;align-items:center;gap:16px;margin-top:6px}
.ring{width:124px;flex:none}
.ring .rt{fill:none;stroke:#3a230022;stroke-width:10}
.ring .ra{fill:none;stroke:#fff;stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .45s cubic-bezier(.2,.8,.2,1)}
.ring .ra.over{stroke:#c4142f}
.ring .rn{fill:#3a2300;font:600 21px var(--fd);text-anchor:middle}
.ring .rl{fill:#3a2300;opacity:.75;font:700 8px var(--fb);text-anchor:middle}
.hs{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hs .st{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid #3a23001f;padding-bottom:3px}
.hs .st:last-child{border:0}
.hs .st span{font-size:13px;font-weight:700;opacity:.8}.hs .st b{font:600 20px var(--fd)}
.hs p{margin:0;font-weight:700}
.hbtn{background:#fff;box-shadow:none;align-self:flex-start}
@media(max-width:380px){.ring{width:108px}.hb{gap:12px}.hs .st b{font-size:18px}}

/* Meal cards */
.mh{display:flex;align-items:center;gap:10px}
.md{width:12px;height:12px;border-radius:50%;background:var(--mc);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--mc) 22%,transparent)}
.mh h3{flex:1;font-size:18px}
.mt{font-weight:800}.mt small{font-weight:600;color:var(--mu)}
.addm{width:38px;height:38px;border-radius:50%;flex:none;background:var(--mc);color:#2b1a00;font:600 24px/1 var(--fd);display:grid;place-content:center;transition:transform .25s var(--bounce)}
.items{margin-top:4px;display:flex;flex-direction:column}
.items .row+.row{border-top:1px solid var(--bd)}
.empty{margin-top:6px}
.ghost,.copy{width:100%;text-align:left;border-radius:14px;padding:8px 12px;font-weight:700;font-size:14px}
.ghost{background:none;color:var(--mu);border:1.5px dashed var(--bd)}
.copy{background:color-mix(in srgb,var(--mc) 16%,transparent);color:var(--tx)}

/* Exercise */
.xrow{padding:6px 0}.xrow+.xrow{border-top:1px solid var(--bd)}
.xtop{display:flex;align-items:center;gap:6px}
.xcal{font-weight:800;white-space:nowrap;color:var(--ok)}
.xsub{display:flex;align-items:center;gap:6px;padding-left:6px}
.ed .xsub input{width:62px;flex:none;text-align:right;padding:6px 8px;background:var(--fld)}
.xsub .unit{color:var(--mu);font-size:13px;font-weight:700}
.lv{display:flex;gap:4px;flex:1;min-width:0}
.lv button{flex:1;min-width:0;background:var(--fld);color:var(--mu);border-radius:999px;padding:7px 2px;font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv button.on{background:var(--ex);color:#04222b}
.xform{display:flex;flex-direction:column;gap:10px}
.xchips{display:flex;gap:6px;flex-wrap:wrap}
.xchips button{background:var(--fld);color:var(--tx);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px}
.xchips button.on{background:color-mix(in srgb,var(--ex) 28%,transparent)}
.xin{display:flex;align-items:center;gap:10px}
.xin input{width:104px;flex:none;text-align:center;font:600 24px/1.1 var(--fd);padding:10px}
.lvo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lvo .opt{padding:10px 6px;align-items:center;text-align:center}
.lvo .opt b{font-size:16px}.lvo .opt span{font-size:12px;line-height:1.3}
.lvo .opt.on{border-color:var(--ex);background:color-mix(in srgb,var(--ex) 14%,var(--card))}
.xprev{text-align:center;font-weight:700;color:var(--mu);font-size:13px}.xprev b{display:block;font:600 34px/1.1 var(--fd);color:var(--tx)}
.kseg button.on{background:var(--mc);color:#2b1a00}

/* Week */
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tiles2>div{background:var(--fld);border-radius:16px;padding:10px 14px;min-width:0}
.tiles2 b{display:block;font:600 24px/1.2 var(--fd)}
.tiles2 small{color:var(--mu);font-size:12px;font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart .cv{fill:var(--tx);font:700 10px var(--fb);text-anchor:middle}
.chart .cx{fill:var(--mu);font:700 11px var(--fb);text-anchor:middle}
.chart .cx.on{fill:var(--tx)}
.chart .tline{stroke:var(--tang);stroke-width:1.5;stroke-dasharray:4 4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);font-weight:700;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.tl{height:0;width:14px;border-top:2px dashed var(--tang);border-radius:0;vertical-align:3px}
.dayrow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;color:var(--tx);padding:7px 2px;text-align:left}
.dayrow+.dayrow{border-top:1px solid var(--bd)}
.dayrow>span:first-child{display:flex;flex-direction:column;min-width:0}
.dr{display:flex;flex-direction:column;align-items:flex-end;gap:3px}

/* Goal */
.tbig{display:flex;flex-direction:column;align-items:flex-start}
.tbig b{font:600 46px/1.05 var(--fd);background:linear-gradient(90deg,var(--tang),var(--grape));-webkit-background-clip:text;background-clip:text;color:transparent}
.ln{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:14px}
.ln+.ln{border-top:1px solid var(--bd)}.ln b{white-space:nowrap}
.note{margin:10px 0 0;padding:10px 12px;border-radius:14px;background:var(--fld);font-size:13px;font-weight:600}
.form{display:flex;flex-direction:column;gap:12px}
.fr{display:flex;align-items:center;gap:8px}
.fr>label{width:116px;flex:none;color:var(--mu);font-size:14px;font-weight:700}
.fr input{width:84px;flex:none;text-align:right}
.fr .unit{color:var(--mu);font-size:13px;font-weight:700}
.fr.col{flex-direction:column;align-items:stretch}.fr.col>label{width:auto}
.fr .seg{flex:1}

/* Backup reminder */
.bknag p{margin:0 0 10px;display:flex;flex-direction:column;gap:2px}

/* Foods */
.flist .row+.row{border-top:1px solid var(--bd)}

/* Recipes */
.rtag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--grape) 18%,transparent);color:var(--over);margin-right:5px;vertical-align:1px}
.rsub{display:block;color:var(--mu);font-size:13px;font-weight:600;margin-top:2px;line-height:1.35;overflow-wrap:anywhere}
.rbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;color:var(--tx);padding:7px 4px;text-align:left;border-radius:12px}
.rbtn .fn{flex:1;min-width:0;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.rbtn .fc{font-weight:800;white-space:nowrap}
.rbtn .chev{flex:none;display:grid;color:var(--mu)}
.reh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.rtot{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rtot b{font:600 40px/1.05 var(--fd);background:linear-gradient(90deg,var(--tang),var(--grape));-webkit-background-clip:text;background-clip:text;color:transparent}
.prow{padding:7px 0}.prow+.prow{border-top:1px solid var(--bd)}
.ptop{display:flex;align-items:flex-start;gap:6px}
.ptop .pn{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.3;padding-top:6px}
.psub{display:flex;align-items:center;gap:10px;margin-top:4px}
.psub>.mu{flex:1;min-width:0}
.pc{min-width:46px;text-align:right;font-weight:800}
.mkr{display:block;margin-top:4px;padding:8px 2px 2px;font-size:13px;font-weight:700}

/* Brand / serving size */
.nmc{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.nmc textarea.nm{flex:none}
.isub{color:var(--mu);font-size:13px;font-weight:600;line-height:1.3;padding:0 4px 5px;margin-top:-3px;overflow-wrap:anywhere}
.fl{display:flex;flex-direction:column;gap:2px}
.fl .sec{margin:0 0 4px}.fl .sec i{font-style:normal;font-weight:700;text-transform:none;letter-spacing:0;opacity:.8}
.szr{display:flex;gap:8px}
.szr input{width:92px;flex:none;text-align:right}
.szr select{flex:1}
.uchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.uchip{display:inline-flex;align-items:center;gap:2px;background:var(--fld);border-radius:999px;padding:3px 4px 3px 12px;font-weight:700;font-size:14px}
.uchip button{background:none;color:var(--mu);width:26px;height:26px;border-radius:50%;display:grid;place-content:center;padding:0}
.uchip button:hover{color:var(--over)}
.ued{margin-top:8px;padding:10px;border-radius:14px;border:1.5px dashed var(--bd)}

/* Settings */
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btns>button{flex:1}
details summary{cursor:pointer;list-style:none;margin-top:12px}summary::-webkit-details-marker{display:none}
.confirm{margin-top:12px;padding:12px;border-radius:16px;border:1.5px solid var(--over);background:color-mix(in srgb,var(--grape) 8%,var(--card))}
.confirm p{margin:0 0 10px;font-weight:700}

/* Bottom nav */
nav{position:fixed;z-index:6;left:0;right:0;bottom:0;display:flex;align-items:center;gap:2px;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--bd);padding-top:5px;padding-bottom:calc(5px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nh{flex:1;display:flex;gap:2px;min-width:0;position:relative;z-index:1}
/* One highlight pill that glides between tabs; the buttons themselves never move */
.hl{position:absolute;left:0;top:0;z-index:0;pointer-events:none;border-radius:16px;width:var(--hw,0);height:var(--hh,0);transform:translate3d(var(--hx,0),var(--hy,0),0);background:color-mix(in srgb,var(--hc,var(--tang)) 14%,transparent);opacity:var(--ho,0);transition:transform .34s var(--bounce),width .34s var(--bounce),opacity .2s,background .25s}
nav.drag .hl{transition:none}
/* Neighbouring tab shown beside the current one while swiping */
#peek{position:fixed;left:0;right:0;bottom:0;z-index:4;overflow:hidden;pointer-events:none;background:var(--bg);will-change:transform}
nav .tb{flex:1;min-width:0;background:none;color:var(--mu);border-radius:16px;padding:6px 0 5px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .25s}
nav .tb.on{color:var(--tc)}
.ni{width:23px;height:23px}
.qab{flex:none;width:64px;height:64px;margin:-26px 6px 0;border-radius:50%;background:var(--hero);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid var(--bg);box-shadow:0 8px 20px -4px rgba(255,120,20,.6);transition:transform .25s var(--bounce)}
.qab b{font:600 30px/.9 var(--fd)}.qab span{font-size:9px;font-weight:800}
.qab:active{transform:scale(.92)}

/* Add sheet */
.sheet{position:fixed;inset:0;z-index:20;pointer-events:none}
.sheet.on{pointer-events:auto}
.sbk{position:absolute;inset:0;background:#1a120080;opacity:0;transition:opacity .2s}
.sheet.on .sbk{opacity:1}
.sp{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:26px 26px 0 0;padding-top:8px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 30px rgba(0,0,0,.2)}

 S=>{S.set=S.set||{};if(!S.set.theme)S.set.theme='system';S.prof=Object.assign(BLANK(),S.prof||{});S.foods=S.foods||[];S.days=S.days||{}},

const CHL='<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
const CHR='<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
// Name box that grows to show the whole name
const nameBox=(v,p,label)=>`<textarea class="nm" rows="1" data-p="${p}" data-t="s" aria-label="${label}">${esc(v)}</textarea>`;
const fit=el=>{el.style.height='auto';el.style.height=el.scrollHeight+'px'};
const fitNames=()=>document.querySelectorAll('textarea.nm').forEach(fit);
const ICB=f=>`<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`;
// One serving of a logged item
const baseFood=x=>({n:(x.n||'').replace(/\s\u00d7[\d.]+$/,'').trim(),cal:Math.round(iper(x))});
// "6 tbsp" for 3 servings of a 2 tbsp food
const qtyTxt=x=>{const sz=(x.sz||'').trim();if(!sz)return '';const m=/^([\d.]+)\s*(.*)$/.exec(sz);return m&&num(m[1])>0?(qf(num(m[1])*iq(x))+' '+m[2]).trim():qf(iq(x))+' '+sz};
// A food is the same food when its name and brand match
const fkey=(n,br)=>(n||'').trim().toLowerCase()+'|'+(br||'').trim().toLowerCase();
const inFoods=(n,br)=>!!(n||'').trim()&&S.foods.some(f=>fkey(f.n,f.br)==fkey(n,br));
const sizeTxt=f=>[num(f.amt)>0?qf(f.amt):'',(f.u||'').trim()].filter(Boolean).join(' ');
const foodSub=f=>[(f.br||'').trim(),f.sz||sizeTxt(f)].filter(Boolean).join(' \u00b7 ');
const metaOf=f=>({br:(f.br||'').trim(),sz:f.sz||sizeTxt(f)});
function newFoodObj(n,cal,br,sz){const f={id:uid('f'),n,cal:Math.round(num(cal))};if(br)f.br=br;const m=/^\s*([\d.]+)\s*(.*)$/.exec(sz||'');if(m&&num(m[1])>0){f.amt=num(m[1]);if(m[2].trim())f.u=m[2].trim()}else if((sz||'').trim())f.u=sz.trim();return f}
const subLine=f=>{const t=foodSub(f);return t?`<small class="rsub">${esc(t)}</small>`:''};
// Recipes: a saved food with parts [{fid, n, cal, q}]. fid links to a saved food (its name and calories stay live);
// n and cal are a copy, so a part keeps working as a one-off if that food is deleted. Recipes can't contain recipes.
const isRec=f=>!!(f&&Array.isArray(f.parts));
const qf=q=>String(Math.round(num(q)*100)/100);
const partsTxt=f=>f.parts.map(p=>p.n+(num(p.q)!=1?' \u00d7'+qf(p.q):'')).join(', ');
const foodById=id=>!!id&&S.foods.find(f=>f.id==id&&!isRec(f));
const liveCal=p=>{const s=foodById(p.fid);return s?Math.round(num(s.cal)):num(p.cal)};
const liveName=p=>{const s=foodById(p.fid);return s?s.n:p.n};
function syncRecipes(){if(!S||!Array.isArray(S.foods))return;const by={};S.foods.forEach(f=>{if(f&&!isRec(f))by[f.id]=f});
 S.foods.forEach(f=>{if(!isRec(f))return;f.parts.forEach(p=>{const s=p.fid&&by[p.fid];if(s){p.n=s.n;p.cal=Math.round(num(s.cal))}});f.cal=Math.round(sum(f.parts,p=>num(p.cal)*num(p.q)))})}
let TT=0,UNDO=null,UGRP='',UCNT=0;
// grp: consecutive toasts in the same group (e.g. several quick deletes) share one Undo that reverts all of them, newest first
function toast(msg,undo,grp){const el=$('#toast');
 if(undo&&grp&&UNDO&&UGRP==grp){const prev=UNDO,cur=undo;undo=()=>{cur();prev()};UCNT++;msg=grp=='del'?`Deleted ${UCNT} items`:msg}else UCNT=1;
 UGRP=undo?grp||'':'';el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-a="undo">Undo</button>':''}`;UNDO=undo||null;el.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>{el.classList.remove('on');UNDO=null;UGRP=''},4500)}
// Backup reminder: after 3+ logged days, nudge if the last backup (or snooze) is more than a week old
const DAY_MS=864e5;
function needBk(){const logged=Object.keys(S.days).filter(d=>MEALS.some(m=>items(d,m.k).length)||xItems(d).length);if(logged.length<3)return false;
 let first=logged[0];for(const d of logged)if(d<first)first=d;
 return Date.now()-Math.max(num(S.set.lastBk),num(S.set.bkSnooze),new Date(first+'T00:00').getTime())>7*DAY_MS}
const markBk=()=>{S.set.lastBk=Date.now();save()};
const mealOf=k=>MEALS.find(m=>m.k==k)||EX;
const defMeal=()=>{const h=new Date().getHours()+new Date().getMinutes()/60;return h<10.5?'b':h<14.5?'l':h<17?'s':h<21?'d':'s'};

// 6. VIEWS
// =====================================================================
// ---- Today ----
function ring(eaten,t){const R0=42,C=2*Math.PI*R0,p=t?Math.min(1,eaten/t):0,over=t&&eaten>t,v=t?Math.abs(t-eaten):eaten;
 return `<svg class="ring" viewBox="0 0 100 100" role="img" aria-label="${t?fmt(v)+(over?' calories over':' calories left'):fmt(eaten)+' calories eaten'}"><circle cx="50" cy="50" r="${R0}" class="rt"/><circle cx="50" cy="50" r="${R0}" class="ra${over?' over':''}" stroke-dasharray="${(p*C).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 50 50)"/><text x="50" y="54" class="rn">${fmt(v)}</text><text x="50" y="66" class="rl">${t?(over?'CAL OVER':'CAL LEFT'):'CAL EATEN'}</text></svg>`}
function mealCard(m){const it=items(D,m.k),y=items(addDays(D,-1),m.k),p=`days.${D}.${m.k}`;
 return `<section class="card meal" data-k="${m.k}" style="--mc:${m.c}"><div class="mh"><span class="md"></span><h3>${m.n}</h3><span class="mt">${fmt(mealTot(D,m.k))} <small>cal</small></span><button class="addm" data-a="open" data-m="${m.k}" aria-label="Add food to ${m.n}">+</button></div>`
 +(it.length?`<div class="items">${it.map((x,i)=>{const sv=inFoods(baseFood(x).n,x.br)||!!(x.fid&&S.foods.some(f=>f.id==x.fid)),q=iq(x),sub=[q==1?'serving':'servings',qtyTxt(x),(x.br||'').trim()].filter(Boolean).join(' \u00b7 '),dm=`data-m="${m.k}" data-i="${i}"`;return `<div class="row ed it" data-m="${m.k}" data-i="${i}"><span class="grip" title="Drag to another meal">${ICG}</span><div class="nmc">${nameBox(x.n,`${p}.${i}.n`,'Food')}<div class="iqr"><div class="step sm"><button data-a="iQ" ${dm} data-n="-0.5" aria-label="Fewer servings of ${esc(x.n)}">\u2212</button><input type="number" class="qin" inputmode="decimal" step="any" value="${qf(q)}" data-a="iQs" ${dm} aria-label="Servings of ${esc(x.n)}"><button data-a="iQ" ${dm} data-n="0.5" aria-label="More servings of ${esc(x.n)}">+</button></div><small class="isub">${esc(sub)}</small></div></div><input type="number" class="a" inputmode="numeric" value="${esc(x.cal)}" data-a="iCal" ${dm} aria-label="Total calories"><button class="x${sv?' saved':''}" data-a="saveItem" data-m="${m.k}" data-i="${i}" aria-label="${sv?esc(x.n)+' is in My foods':'Save '+esc(x.n)+' to My foods'}">${ICB(sv)}</button><button class="x" data-a="delItem" data-m="${m.k}" data-i="${i}" aria-label="Delete ${esc(x.n)}">${ICX}</button></div>`}).join('')}</div>${it.length>1?`<button class="lnk mkr" data-a="mealRecipe" data-m="${m.k}">Save these ${it.length} as a recipe</button>`:''}`
 :`<div class="empty">${y.length?`<button class="copy" data-a="copyY" data-m="${m.k}">Copy yesterday's ${m.n.toLowerCase()} \u00b7 ${y.length} item${y.length==1?'':'s'}, ${fmt(sum(y,x=>num(x.cal)))} cal</button>`:`<button class="ghost" data-a="open" data-m="${m.k}">Nothing yet. Tap to add.</button>`}</div>`)+`</section>`}
function exCard(){const xs=xItems(D),p=`days.${D}.x`;
 return `<section class="card exc" style="--mc:var(--ex)"><div class="mh"><span class="md"></span><h3>Exercise</h3><span class="mt">${xs.length?'\u2212':''}${fmt(burned(D))} <small>cal</small></span><button class="addm" data-a="open" data-m="x" aria-label="Add exercise">+</button></div>`
 +(xs.length?`<div class="items">${xs.map((x,i)=>`<div class="xrow ed"><div class="xtop">${nameBox(x.n,`${p}.${i}.n`,'Exercise')}<span class="xcal">\u2212${fmt(x.cal)}</span><button class="x" data-a="delX" data-i="${i}" aria-label="Delete ${esc(x.n)}">${ICX}</button></div><div class="xsub"><input type="number" inputmode="decimal" step="0.25" value="${esc(x.h)}" data-a="xHrs" data-i="${i}" aria-label="Hours"><span class="unit">hr</span><div class="lv">${LEVELS.map(([,l],j)=>`<button class="${num(x.lvl)==j?'on':''}" data-a="xLvl" data-i="${i}" data-v="${j}">${l}</button>`).join('')}</div></div></div>`).join('')}</div>`
 :`<div class="empty"><button class="ghost" data-a="open" data-m="x">Worked out? Tap to log it. Calories burned add to what you can eat.</button></div>`)+`</section>`}
function vToday(){const food=foodTot(D),bn=burned(D),tt=dayTarget(D),budget=tt?tt+bn:0,left=budget-food,st=(l,v)=>`<div class="st"><span>${l}</span><b>${v}</b></div>`;
 return `<section class="hero"><div class="dnav"><button data-a="day" data-n="-1" aria-label="Previous day">${CHL}</button><button class="dl" data-a="today" aria-label="Go to today"><b>${dayLabel(D)}</b><span>${fmtDay(D)}</span></button><button data-a="day" data-n="1" aria-label="Next day" ${D>=tdy()?'disabled':''}>${CHR}</button></div>
 <div class="hb">${ring(food,budget)}<div class="hs">${tt?st('Target',fmt(tt))+st('Eaten',fmt(food))+st('Exercise','+'+fmt(bn))+st(left>=0?'Left':'Over',fmt(Math.abs(left))):`<p>Set your daily target to see what's left.</p><button class="hbtn" data-a="tab" data-id="goal">Set my target</button>`}</div></div></section>
 ${needBk()?`<section class="card bknag"><p><b>Back up your log?</b><span class="mu">It's only saved in this browser, and some browsers clear site data after a while.</span></p><div class="row"><button class="btn" data-a="tab" data-id="more">Back up</button><button class="lnk" data-a="bkLater">Later</button></div></section>`:''}
 <div class="meals">${MEALS.map(mealCard).join('')}${exCard()}</div>`}

// ---- Week ----
function chart(rows){const W=340,H=184,pl=4,pr=4,pt=20,pb=24,ih=H-pt-pb,cw=(W-pl-pr)/7,bw=cw*.58,t=target();
 const mx=Math.max(500,...rows.map(r=>r.tot),...rows.map(r=>r.t||0))*1.14,y=v=>pt+ih-v/mx*ih;
 const bars=rows.map((r,i)=>{const x=pl+cw*i+(cw-bw)/2,cx=(x+bw/2).toFixed(1),over=r.t&&r.tot>r.t,on=r.d==tdy();
  return (r.tot?`<rect x="${x.toFixed(1)}" y="${y(r.tot).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(3,r.tot/mx*ih).toFixed(1)}" rx="6" style="fill:${over?'var(--grape)':'var(--lime)'}"><title>${fmtDay(r.d)}: ${fmt(r.tot)} cal</title></rect><text x="${cx}" y="${(y(r.tot)-5).toFixed(1)}" class="cv">${fmt(r.tot)}</text>`
   :`<rect x="${x.toFixed(1)}" y="${(pt+ih-3).toFixed(1)}" width="${bw.toFixed(1)}" height="3" rx="1.5" style="fill:var(--bd)"/>`)+`<text x="${cx}" y="${H-6}" class="cx${on?' on':''}">${on?'Today':wk(r.d)}</text>`}).join('');
 // Target line follows each day's own target, so a bar's color always matches where it sits against the line
 let tl='';rows.forEach((r,i)=>{if(!r.t)return;const yy=y(r.t).toFixed(1),p=rows[i-1],x1=pl+cw*i+(p&&p.t==r.t?0:2),x2=pl+cw*(i+1)-(rows[i+1]&&rows[i+1].t==r.t?0:2);tl+=`<line x1="${x1.toFixed(1)}" x2="${x2.toFixed(1)}" y1="${yy}" y2="${yy}" class="tline"/>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net calories (food minus exercise) each day for the last 7 days">${tl}${bars}</svg>
 <div class="legend"><span><i style="background:var(--lime)"></i>Within target</span><span><i style="background:var(--grape)"></i>Over target</span>${tl?`<span><i class="tl"></i>Target${t?' '+fmt(t.t):''}</span>`:''}</div>`}
function vWeek(){const T0=tdy(),ds=Array.from({length:7},(_,i)=>addDays(T0,i-6)),rows=ds.map(d=>{const food=foodTot(d),bn=burned(d);return {d,food,bn,tot:Math.max(0,food-bn),t:dayTarget(d)}}),t=target();
 // Stats use finished days only; today is still in progress
 const lg=rows.filter(r=>r.food>0&&r.d<T0),avg=lg.length?sum(lg,r=>r.tot)/lg.length:0,wt=lg.filter(r=>r.t),on=wt.filter(r=>r.tot<=r.t).length;
 const chip=r=>{const df=r.tot-r.t;return df>0?`<span class="chip over">${fmt(df)} over</span>`:r.d==T0?`<span class="chip">${fmt(-df)} left</span>`:`<span class="chip ok">${fmt(-df)} under</span>`};
 return `<h2 class="ph">Last 7 days</h2><section class="card"><div class="tiles2"><div><span class="mu">Daily average</span><b>${fmt(avg)}</b><small>${lg.length} of 6 full days logged</small></div><div><span class="mu">Within target</span><b>${wt.length?`${on} of ${wt.length}`:'–'}</b><small>${t?'Target '+fmt(t.t)+' cal':'No target set yet'}</small></div></div>${chart(rows)}<p class="mu" style="margin:6px 0 0">Bars show food minus exercise. Averages leave out today until it's over.</p></section>
 <section class="card"><div class="sec">Days</div>${rows.slice().reverse().map(r=>`<button class="dayrow" data-a="goDay" data-d="${r.d}"><span><b>${dayLabel(r.d)}</b><span class="mu">${fmtDay(r.d)}</span></span><span class="dr">${r.food||r.bn?`<b>${fmt(r.tot)} cal</b>${r.bn?`<span class="mu" style="font-size:12px">${fmt(r.food)} eaten \u2212 ${fmt(r.bn)} exercise</span>`:''}${r.t?chip(r):''}`:'<span class="chip">Nothing logged</span>'}</span></button>`).join('')}</section>`}

// ---- Foods ----
function vFoods(){if(RE)return vRecipe();if(FE)return vFood();
 const all=S.foods.map((f,i)=>({f,i})),recs=all.filter(x=>isRec(x.f)),plain=all.filter(x=>!isRec(x.f)),chev=CHR.replace(/24/g,'18');
 return `<h2 class="ph">My foods</h2><section class="card"><div class="btns" style="margin-top:0"><button class="btn" data-a="newFood">+ New food</button><button class="btn sec2" data-a="newRecipe">+ New recipe</button></div><p class="mu" style="margin:10px 2px 0">Saved foods and recipes show first when you tap +, so logging them takes one tap. A recipe adds up foods you've saved, like bread and peanut butter for a PB sandwich.</p></section>
 ${recs.length?`<section class="card flist"><div class="sec">Recipes</div>${recs.map(({f,i})=>`<div class="row"><button class="rbtn" data-a="editRecipe" data-i="${i}"><span class="fn">${esc(f.n)}<small class="rsub"><span class="rtag">Recipe</span>${esc(partsTxt(f))}</small></span><span class="fc">${fmt(f.cal)}</span><span class="chev">${chev}</span></button><button class="x" data-a="delFood" data-i="${i}" aria-label="Delete ${esc(f.n)}">${ICX}</button></div>`).join('')}</section>`:''}
 <section class="card flist">${recs.length?'<div class="sec">Foods</div>':''}${plain.length?plain.map(({f,i})=>`<div class="row"><button class="rbtn" data-a="editFood" data-i="${i}"><span class="fn">${esc(f.n)}${subLine(f)}</span><span class="fc">${fmt(f.cal)}</span><span class="chev">${chev}</span></button><button class="x" data-a="delFood" data-i="${i}" aria-label="Delete ${esc(f.n)}">${ICX}</button></div>`).join(''):'<p class="mu" style="margin:0">No saved foods yet. Tap + New food, or tick “Save to My foods” when you log something.</p>'}</section>`}

 </div></section>

// ---- Recipe editor (shown in the My foods tab) ----
let RE=null,RQ='',RERR='';
function reMatches(){const q=RQ.trim().toLowerCase();return S.foods.filter(f=>!isRec(f)&&(!q||(f.n||'').toLowerCase().includes(q))).slice(0,30)}
function reList(){const m=reMatches();return m.length?m.map(f=>`<div class="fi"><button class="fb" data-a="reAdd" data-id="${esc(f.id)}"><span class="fn">${esc(f.n)}${subLine(f)}</span><span class="fc">${fmt(f.cal)} cal</span><span class="pl" aria-hidden="true">+</span></button></div>`).join('')
 :`<p class="mu" style="margin:8px 2px 0">${RQ.trim()?'No saved foods match. Add it as a one-off below.':'Save some foods first, or add one-offs below.'}</p>`}

 <section class="card" style="--mc:var(--grape)"><div class="sec">Ingredients</div>${ps.length?ps.map((p,i)=>{const c=liveCal(p),nm=liveName(p),one=!foodById(p.fid);return `<div class="prow"><div class="ptop"><b class="pn">${esc(nm)}${(()=>{const s=foodById(p.fid);return s?subLine(s):''})()}</b><button class="x" data-a="reRm" data-i="${i}" aria-label="Remove ${esc(nm)}">${ICX}</button></div><div class="psub"><span class="mu">${fmt(c)} cal a serving${one?' · one-off':''}</span><div class="step"><button data-a="reQ" data-i="${i}" data-n="-0.25" aria-label="Fewer servings of ${esc(nm)}">−</button><b>${qf(p.q)}</b><button data-a="reQ" data-i="${i}" data-n="0.25" aria-label="More servings of ${esc(nm)}">+</button></div><b class="pc">${fmt(c*num(p.q))}</b></div></div>`}).join('')
  :'<p class="mu" style="margin:0">No ingredients yet. Add some below.</p>'}</section>
 <section class="card" style="--mc:var(--grape)"><div class="sec">Add from My foods</div><input id="req" type="text" placeholder="Search My foods" autocomplete="off" value="${esc(RQ)}" aria-label="Search My foods"><div id="rel" style="margin-top:4px">${reList()}</div>
